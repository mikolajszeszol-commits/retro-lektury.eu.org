<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pobieralnia Aplikacji</title>
    <style>
        /* Reset podstawowych marginesów */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Ciemne tło główne */
            color: #e0e0e0;           /* Jasny, niemęczący oczu tekst */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 10px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        p {
            color: #aaaaaa;
            font-size: 1.1rem;
        }

        /* Kontener siatki 3x3 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px; /* Odstępy między przyciskami */
            padding: 20px;
            max-width: 800px;
            width: 100%;
            justify-items: center;
        }

        /* Styl kwadratowych przycisków (ok. 4cm x 4cm na standardowych ekranach) */
        .app-button {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 150px odpowiada w przybliżeniu około 4cm na większości ekranów desktopowych/mobilnych */
            width: 150px;
            height: 150px;
            background-color: #1e1e1e; /* Nieco jaśniejszy szary dla przycisku */
            color: #ffffff;
            text-decoration: none;
            border: 2px solid #333333;
            border-radius: 8px; /* Delikatne zaokrąglenie dla nowoczesnego wyglądu, zmień na 0 dla idealnego prostokąta */
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            padding: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        /* Efekty po najechaniu myszką */
        .app-button:hover {
            background-color: #292929;
            border-color: #00adb5; /* Akcent kolorystyczny (np. morski) */
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 173, 181, 0.2);
        }

        /* Ikona lub strzałka pobierania pod tekstem */
        .app-button::after {
            content: "⬇";
            margin-top: 10px;
            font-size: 1.2rem;
            color: #00adb5;
        }

        footer {
            margin-top: 50px;
            color: #555555;
            font-size: 0.9rem;
        }

        /* Responsywność dla mniejszych ekranów (smartfony) */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr); /* 2 kolumny na telefonach */
                gap: 15px;
            }
            .app-button {
                width: 130px;
                height: 130px;
                font-size: 1rem;
            }
        }
        @media (max-width: 400px) {
            .grid-container {
                grid-template-columns: 1fr; /* 1 kolumna na bardzo małych ekranach */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Panel Pobierania Aplikacji</h1>
